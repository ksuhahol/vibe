<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ночь в музее</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
    <section class="event-card">
        <h1 id="event-title">Ночь в музее</h1>

        <p>15 ноября, 18:30</p>

        <p>Музей космонавтики, проспект Мира, 111</p>

        <p>Вечерняя программа с выставкой и экскурсиями</p>

        <button id="show-program">Показать программу</button>

        <div id="program" hidden></div>
    </section>

    <section class="services-card">

    <h2>Дополнительные услуги</h2>

    <div id="data-error" hidden></div>

    <form id="service-form">

        <label>
        <input type="checkbox" id="guide">
        Экскурсия с гидом — 500 руб.
        </label>

        <label>
        <input type="checkbox" id="audio">
        Аудиогид — 350 руб.
        </label>

        <label>
        <input type="checkbox" id="catalog">
        Каталог выставки — 250 руб.
        </label>

             <button type="submit">Рассчитать стоимость</button>

    </form>

        <div id="choice-error" hidden></div>
        <div id="result" hidden></div>
        <pre id="report-json" hidden></pre>

    </section>
</main>

    <script src="app.js"></script>

</body>
</html>
